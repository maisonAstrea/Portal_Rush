<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Portal Rush 3D – prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060f; font-family: "Trebuchet MS", system-ui, sans-serif; touch-action: none; user-select: none; }
  canvas { display: block; }
  #hud { position: fixed; left: 14px; top: calc(12px + env(safe-area-inset-top, 0px)); color: #e8ffe8; text-shadow: 0 0 8px #39ff8a; font-weight: 700; pointer-events: none; }
  #msg { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); color: #39ff8a; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; }
#assetStatus{position:fixed;left:12px;bottom:12px;z-index:5;background:#06150de8;color:#dfffea;padding:12px;border:1px solid #39ff8a77;border-radius:12px;font:12px/1.5 system-ui;white-space:pre-line;pointer-events:none}</style>
</head>
<body>
<div id="hud">Portal Rush 3D · prototype<br><small>ZQSD / WASD ou flèches : marcher · Espace : sauter · approche le portail</small></div>
<div id="world" style="position:fixed;right:14px;top:14px;color:#d9ffe8;background:#07140fcc;padding:10px 14px;border:1px solid #39ff8a77;border-radius:12px;z-index:2">Dimension : <strong id="worldName">Portail Central</strong><br><small>Approche le portail et appuie sur E</small></div>
<div id="msg"></div><div id="assetStatus">Vérification des modèles 3D…</div>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

// ---------- Renderer, scène, caméra ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07060f);
scene.fog = new THREE.Fog(0x07060f, 40, 140);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 300);

// Lumières cartoon néon
scene.add(new THREE.HemisphereLight(0xb6ffd2, 0x1a0b33, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(20, 40, 10);
scene.add(sun);

// ---------- Sol et décor (placeholders à remplacer par Modular Sci-Fi / Stylized Nature) ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(120, 64),
  new THREE.MeshStandardMaterial({ color: 0x1d3d2a, roughness: 0.9 })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const crystalMat = new THREE.MeshStandardMaterial({ color: 0x39ff8a, emissive: 0x39ff8a, emissiveIntensity: 0.6, roughness: 0.3 });
const crystals = [];
// Décors procéduraux temporaires, distincts pour chaque dimension.
const biomeProps = new THREE.Group();
scene.add(biomeProps);
const biomeMaterials = [
  new THREE.MeshStandardMaterial({ color: 0x60ad37, emissive: 0x275c12, emissiveIntensity: 0.25 }),
  new THREE.MeshStandardMaterial({ color: 0xa08aff, emissive: 0x5d39cc, emissiveIntensity: 0.45 }),
  new THREE.MeshStandardMaterial({ color: 0xffa24f, roughness: 0.95 }),
  new THREE.MeshStandardMaterial({ color: 0x7be8ff, metalness: 0.25, roughness: 0.25, emissive: 0x216f9a, emissiveIntensity: 0.25 })
];
function buildBiome(index) {
  biomeProps.clear();
  if (index < 0) return;
  const material = biomeMaterials[index];
  // Implantation déterministe : même paysage à chaque visite.
  for (let i = 0; i < 34; i++) {
    const angle = i * 2.3999632297;
    const radius = 13 + Math.sqrt(i / 34) * 78;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    // Garde libre l'accès au portail.
    if (Math.abs(x) < 8 && z < 0 && z > -40) continue;
    const height = 2 + ((i * 13) % 11) * 0.65;
    let geometry;
    if (index === 0) geometry = new THREE.ConeGeometry(1.2 + (i % 3) * 0.3, height, 5);
    else if (index === 1) geometry = new THREE.OctahedronGeometry(1.3 + (i % 4) * 0.4);
    else if (index === 2) geometry = new THREE.DodecahedronGeometry(1.4 + (i % 3) * 0.5);
    else geometry = new THREE.CylinderGeometry(0.5, 1.5, height, 6);
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, index === 1 || index === 2 ? 1.6 : height / 2, z);
    mesh.rotation.y = angle;
    biomeProps.add(mesh);
  }
}
for (let i = 0; i < 40; i++) {
  const a = Math.random() * Math.PI * 2, d = 12 + Math.random() * 90;
  const h = 2 + Math.random() * 5;
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.8 + Math.random(), h, 5), crystalMat);
  c.position.set(Math.cos(a) * d, h / 2, Math.sin(a) * d);
  scene.add(c);
  crystals.push(c);
}

// ---------- Portail animé ----------
const portal = new THREE.Group();
const ring = new THREE.Mesh(
  new THREE.TorusGeometry(4, 0.4, 16, 64),
  new THREE.MeshStandardMaterial({ color: 0x39ff8a, emissive: 0x39ff8a, emissiveIntensity: 1.2 })
);
const disc = new THREE.Mesh(
  new THREE.CircleGeometry(3.6, 48),
  new THREE.MeshBasicMaterial({ color: 0x66ffb0, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
);
portal.add(ring, disc);
portal.position.set(0, 4.5, -30);
scene.add(portal);

// ---------- Personnage placeholder (à remplacer par Universal Base Characters) ----------
const hero = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.6, 1.0, 6, 12),
  new THREE.MeshStandardMaterial({ color: 0xf4f7ff, roughness: 0.5 })
);
body.position.y = 1.1;
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 24, 16),
  new THREE.MeshStandardMaterial({ color: 0xf1d1a8, roughness: 0.6 })
);
head.position.y = 2.2;
const hair = new THREE.Mesh(
  new THREE.SphereGeometry(0.6, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2),
  new THREE.MeshStandardMaterial({ color: 0x9fe8ff, emissive: 0x9fe8ff, emissiveIntensity: 0.3 })
);
hair.position.y = 2.3;
hero.add(body, head, hair);
scene.add(hero);

// Charge des modèles GLB/GLTF quand leurs chemins sont configurés.
// En cas d'absence ou d'erreur, le prototype reste jouable avec ses formes 3D.
const assetLoader = new GLTFLoader();
const mixers = [];
const loadedScenery = [];
const status = { character:"chargement", animations:"chargement", compatibility:"en attente" };
function refreshStatus(){document.getElementById("assetStatus").textContent="Personnage : "+status.character+"\nBibliothèque : "+status.animations+"\nAnimation : "+status.compatibility;}
refreshStatus();
let animationLibraryClips = [];
let playableCharacter = null;
function applyExternalAnimations() {
  if (!playableCharacter || !animationLibraryClips.length) return;
  const characterBones = new Set();
  playableCharacter.traverse(object => { if (object.isBone) characterBones.add(object.name); });
  const compatible = animationLibraryClips.filter(clip =>
    clip.tracks.length && clip.tracks.every(track => characterBones.has(track.name.split(".")[0]))
  );
  if (!compatible.length) {
    status.compatibility="squelettes incompatibles : adaptation nécessaire";refreshStatus();
    console.warn("Animations chargées mais non appliquées : noms d'os incompatibles. Retargeting nécessaire.");
    return;
  }
  const mixer = new THREE.AnimationMixer(playableCharacter);
  const idle = compatible.find(c => /idle|stand/i.test(c.name)) || compatible[0];
  const walk = compatible.find(c => /walk|run/i.test(c.name));
  const idleAction = mixer.clipAction(idle);
  idleAction.play();
  const walkAction = walk && walk !== idle ? mixer.clipAction(walk) : null;
  if (walkAction) { walkAction.play(); walkAction.setEffectiveWeight(0); }
  mixers.push({ mixer, idleAction, walkAction });
  status.compatibility=compatible.length+" animation(s) compatibles"+(walk?" (marche trouvée)":" (marche absente)");refreshStatus();
}
async function readAssetConfig() {
  try {
    const response = await fetch("./assets.json", { cache: "no-cache" });
    if (!response.ok) return;
    const config = await response.json();
    if (config.animationLibrary?.path) {
      assetLoader.load(config.animationLibrary.path, gltf => {
        animationLibraryClips = gltf.animations || [];
        status.animations=animationLibraryClips.length+" clips chargés";refreshStatus();
        console.info("Animations disponibles :", animationLibraryClips.map(clip => clip.name));
        applyExternalAnimations();
      }, undefined, error => {status.animations="échec";refreshStatus();console.warn("Bibliothèque d'animations non chargée :", error);});
    }
    if (config.character && config.character.path) {
      assetLoader.load(config.character.path, gltf => {
        const model = gltf.scene;
        const scale = Number(config.character.scale) || 1;
        model.scale.setScalar(scale);
        model.position.y = Number(config.character.yOffset) || 0;
        hero.add(model);
        status.character="modèle chargé";refreshStatus();
        playableCharacter = model;
        applyExternalAnimations();
        body.visible = head.visible = hair.visible = false;
        if (gltf.animations.length) {
          const mixer = new THREE.AnimationMixer(model);
          const clips = gltf.animations;
          const idle = clips.find(c => /idle|stand/i.test(c.name)) || clips[0];
          const walk = clips.find(c => /walk|run/i.test(c.name));
          const idleAction = mixer.clipAction(idle);
          idleAction.play();
          const walkAction = walk && walk !== idle ? mixer.clipAction(walk) : null;
          if (walkAction) walkAction.play();
          mixers.push({ mixer, idleAction, walkAction });
        }
      }, undefined, error => {status.character="échec (personnage provisoire)";refreshStatus();console.warn("Personnage 3D non chargé :", error);});
    }
    if (Array.isArray(config.scenery)) {
      for (const item of config.scenery) {
        if (!item || !item.path) continue;
        assetLoader.load(item.path, gltf => {
          const model = gltf.scene;
          model.position.set(...(item.position || [0, 0, 0]));
          model.rotation.y = Number(item.rotationY) || 0;
          model.scale.setScalar(Number(item.scale) || 1);
          scene.add(model);
          loadedScenery.push(model);
          if (gltf.animations.length) {
            const mixer = new THREE.AnimationMixer(model);
            mixer.clipAction(gltf.animations[0]).play();
            mixers.push({ mixer });
          }
        }, undefined, error => console.warn("Décor 3D non chargé :", item.path, error));
      }
    }
  } catch (error) {status.character="configuration inaccessible";status.animations="configuration inaccessible";refreshStatus();console.warn("Configuration 3D indisponible :", error); }
}
readAssetConfig();

// ---------- Contrôles ----------
const keys = {};
let nearPortal = false, dimensionIndex = -1;
const dimensions = [
  { name:"Dimension Toxique", ground:0x315b2b, fog:0x173622, glow:0x87ff49 },
  { name:"Forêt Cristalline", ground:0x253b52, fog:0x101d35, glow:0x8c7bff },
  { name:"Désert Zarbi", ground:0x7b4d32, fog:0x4a241e, glow:0xffa14a },
  { name:"Glacier Néon", ground:0x2b5e73, fog:0x142e50, glow:0x4cecff }
];
function usePortal() {
  if (!nearPortal) return;
  dimensionIndex = (dimensionIndex + 1) % dimensions.length;
  const d = dimensions[dimensionIndex];
  document.getElementById("worldName").textContent = d.name;
  ground.material.color.setHex(d.ground);
  scene.background.setHex(d.fog);
  scene.fog.color.setHex(d.fog);
  crystalMat.color.setHex(d.glow);
  crystalMat.emissive.setHex(d.glow);
  buildBiome(dimensionIndex);
  hero.position.set(0, 0, 0);
  vy = 0; grounded = true;
  nearPortal = false;
  msg.textContent = "Bienvenue : " + d.name;
  msg.style.opacity = 1; msgT = 3;
}
addEventListener("keydown", e => { keys[e.code] = true; if (e.code === "Space") { e.preventDefault(); jump(); } if (e.code === "KeyE") usePortal(); });
addEventListener("keyup", e => { keys[e.code] = false; });

let vy = 0, grounded = true;
function jump() { if (grounded) { vy = 8; grounded = false; } }

// ---------- Boucle ----------
const clock = new THREE.Clock();
const speed = 9;
const msg = document.getElementById("msg");
let msgT = 0;
const camOffset = new THREE.Vector3(0, 4.5, 9);
const portalLight = new THREE.PointLight(0x39ff8a, 25, 22);
portalLight.position.copy(portal.position);
scene.add(portalLight);
const camTarget = new THREE.Vector3();

function update(dt) {
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz -= 1;
  if (keys.KeyS || keys.ArrowDown) mz += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  const len = Math.hypot(mx, mz);
  if (len > 0) {
    mx /= len; mz /= len;
    hero.position.x += mx * speed * dt;
    hero.position.z += mz * speed * dt;
    hero.rotation.y = Math.atan2(mx, mz);
  }

  // Gravité simple
  vy -= 22 * dt;
  hero.position.y += vy * dt;
  if (hero.position.y <= 0) { hero.position.y = 0; vy = 0; grounded = true; }

  // Limite du monde
  hero.position.x = THREE.MathUtils.clamp(hero.position.x, -110, 110);
  hero.position.z = THREE.MathUtils.clamp(hero.position.z, -110, 110);

  // Caméra qui suit le personnage
  camTarget.copy(hero.position).add(camOffset);
  camera.position.lerp(camTarget, 1 - Math.pow(0.001, dt));
  camera.lookAt(hero.position.x, hero.position.y + 1.5, hero.position.z);

  // Animations des modèles importés (si présents).
  for (const entry of mixers) {
    entry.mixer.update(dt);
    if (entry.walkAction) {
      const moving = len > 0;
      entry.walkAction.setEffectiveWeight(moving ? 1 : 0);
      entry.idleAction.setEffectiveWeight(moving ? 0 : 1);
    }
  }

  // Animations décor
  const t = clock.elapsedTime;
  ring.rotation.z = t * 0.6;
  disc.material.opacity = 0.25 + Math.sin(t * 3) * 0.1;
  portalLight.intensity = 22 + Math.sin(t * 3) * 5;
  crystals.forEach((c, i) => { c.material.emissiveIntensity = 0.4 + Math.sin(t * 2 + i) * 0.2; });

  // Entrée dans le portail
  const dist = Math.hypot(hero.position.x - portal.position.x, hero.position.z - portal.position.z);
  nearPortal = dist < 5;
  if (dist < 5) {
    msg.textContent = "Appuie sur E pour traverser le portail";
    msg.style.opacity = 1; msgT = 2;
  } else if (msgT > 0) {
    msgT -= dt;
    if (msgT <= 0) msg.style.opacity = 0;
  } else { msg.style.opacity = 0; }
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

camera.position.set(0, 5, 10);
frame();
</script>
</body>
</html>
